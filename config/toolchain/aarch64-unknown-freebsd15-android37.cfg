#
# clang configuration for Android code on FreeBSD/aarch64 (ADR 0002,
# decision 2).  Use: clang22 --config <this file> ...
#
# The FreeBSD driver defines no Android macros, so they are here.  The
# sysroot is the bionic-freebsd sysroot of M1; a later --sysroot wins.
# The link options of decision 2 (-nostdlib, linker64, bionic crt objects)
# come in M1, when bionic-freebsd has its crt objects.
--target=aarch64-unknown-freebsd15-android37
--sysroot=/home/dev/build/sysroot-bionic-freebsd
-D__ANDROID__=1
-D__ANDROID_API__=37
-D__ANDROID_MIN_SDK_VERSION__=37
-ffixed-x18
-fPIE
-fstack-protector-strong
-fno-emulated-tls
-Wundef
