# clang configuration for Android code on FreeBSD/aarch64 (ADR 0002,
# decision 2).  Use: clang22 --config <this file> ...
#
# Only what the bionic-freebsd target needs is here: the target, the
# sysroot, and what clang gives an Android triple by default and a
# FreeBSD triple does not (the Android macros, x18 as the platform
# register, ELF TLS).  The sysroot is the bionic-freebsd sysroot of M1; a
# later --sysroot wins.  The build gives each module its other flags as
# Soong does (aosp/cmake/tier0/bionic/soong-flags.cmake).  Clang does not
# track this file as an input: rebuild a build tree from clean after a
# change here.
--target=aarch64-unknown-freebsd15-android37
--sysroot=/home/dev/build/sysroot-bionic-freebsd
-D__ANDROID__=1
-D__ANDROID_API__=37
-D__ANDROID_MIN_SDK_VERSION__=37
-ffixed-x18
-fno-emulated-tls
