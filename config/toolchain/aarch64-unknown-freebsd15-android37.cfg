# clang configuration for Android code on FreeBSD/aarch64 (ADR 0002,
# decision 2).  Use: clang22 --config <this file> ...
#
# The FreeBSD driver defines no Android macros, so they are here.  The
# sysroot is the bionic-freebsd sysroot of M1; a later --sysroot wins.
# The link options of decision 2 (-nostdlib, linker64, bionic crt objects)
# come in M1, when bionic-freebsd has its crt objects.
#
# -fstack-protector-strong and -D_FORTIFY_SOURCE=3 are the hardening flags
# that AOSP gives all device code.  Code that must not use FORTIFY, such as
# bionic's own _chk functions, adds -U_FORTIFY_SOURCE after them.  AOSP
# also zero-initializes the automatic variables of all its code, and some
# code depends on it (libbase's CachedProperty, for example).  Clang
# does not track this file as an input: rebuild a build tree from clean
# after a change here.
--target=aarch64-unknown-freebsd15-android37
--sysroot=/home/dev/build/sysroot-bionic-freebsd
-D__ANDROID__=1
-D__ANDROID_API__=37
-D__ANDROID_MIN_SDK_VERSION__=37
-ffixed-x18
-fPIE
-fstack-protector-strong
-D_FORTIFY_SOURCE=3
-ftrivial-auto-var-init=zero
-fno-emulated-tls
-Wundef
